name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    outputs:
      pages_enabled: ${{ steps.pages_status.outputs.enabled }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Check Pages configuration
        id: pages_status
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          status="$(curl -sS -o "$RUNNER_TEMP/pages-response.json" -w '%{http_code}' \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/pages")"
          if [ "$status" = "200" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          elif [ "$status" = "404" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "GitHub Pages is not enabled yet. Set Settings → Pages → Source to GitHub Actions; the next push will publish the built site." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Unable to inspect GitHub Pages settings (HTTP $status)." >&2
            exit 1
          fi
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'
      - name: Validate published catalogue
        run: |
          python3 -m unittest discover -s tests -v
          python3 scripts/validate_catalogue.py
      - name: Build Store plugin package
        run: python3 store-plugin/package.py
      - name: Ensure committed package matches source
        run: git diff --exit-code -- store-plugin/plugin.zip
      - name: Build static website artifact
        run: python3 scripts/build_site.py
      - name: Upload site
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site
          include-hidden-files: true
  deploy:
    if: needs.build.outputs.pages_enabled == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v5
